# ============================================
# Nginx reverse proxy config for Folder Cleanup Tool
# Serves the Streamlit app on port 80 (and optionally 443)
# ============================================

events {
    worker_connections 1024;
}

http {
    # WebSocket support for Streamlit
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream streamlit_app {
        server app:8501;
    }

    server {
        listen 80;
        server_name _;

        # Redirect all HTTP to HTTPS (if certs are present)
        # Comment out if you don't have TLS certs in ./nginx/certs
        # return 301 https://$host$request_uri;

        client_max_body_size 100M;

        location / {
            proxy_pass http://streamlit_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Streamlit health check
        location /_stcore/health {
            proxy_pass http://streamlit_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # HTTPS server (uncomment and place certs in ./nginx/certs/)
    # server {
    #     listen 443 ssl;
    #     server_name _;

    #     ssl_certificate     /etc/nginx/certs/server.crt;
    #     ssl_certificate_key /etc/nginx/certs/server.key;

    #     location / {
    #         proxy_pass http://streamlit_app;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection $connection_upgrade;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_read_timeout 86400;
    #     }
    # }
}
